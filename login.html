<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - النظام الرقمي لمتابعة الوضعية الإدارية للأساتذة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1b4332;
            --primary-hover: #2d6a4f;
            --accent-color: #d4af37;
            --card-bg: #ffffff;
            --text-color: #2b2d42;
            --input-border: #d8e2dc;
        }

        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; }

        body {
            margin: 0; padding: 0;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; position: relative; overflow: hidden;
        }

        body::before {
            content: ''; position: absolute; width: 350px; height: 350px;
            border-radius: 50%; background: rgba(255, 255, 255, 0.05);
            top: -50px; right: -50px; z-index: 1;
        }

        body::after {
            content: ''; position: absolute; width: 450px; height: 450px;
            border-radius: 50%; background: rgba(255, 255, 255, 0.03);
            bottom: -100px; left: -100px; z-index: 1;
        }

        .login-card {
            background-color: var(--card-bg);
            padding: 40px 35px; border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            width: 90%; max-width: 440px;
            position: relative; z-index: 2;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
        }

        .header-brand { text-align: center; margin-bottom: 25px; }
        .header-brand h1 {
            font-size: 14px; font-weight: 700; color: #d4af37;
            background-color: #f8f9fa; padding: 6px 12px;
            border-radius: 20px; display: inline-block;
            margin: 0 0 12px 0; border: 1px solid #e9ecef;
        }

        .header-brand h2 {
            font-size: 19px; font-weight: 700; color: var(--primary-color);
            margin: 0; line-height: 1.4; position: relative; padding-bottom: 12px;
        }

        .header-brand h2::after {
            content: ''; position: absolute; bottom: 0; right: 50%;
            transform: translateX(50%); width: 60px; height: 3px;
            background-color: var(--accent-color); border-radius: 2px;
        }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: var(--text-color); font-size: 14px; }
        .form-group input {
            width: 100%; padding: 12px 15px; border: 1.5px solid var(--input-border);
            border-radius: 8px; font-size: 15px; background-color: #f8fafc; color: var(--text-color);
        }

        .form-group input:focus {
            outline: none; border-color: #2c5364; background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(44, 83, 100, 0.15);
        }

        .btn-submit {
            width: 100%; background: linear-gradient(135deg, #1b4332 0%, #2d6a4f 100%);
            color: white; border: none; padding: 14px; border-radius: 8px;
            font-size: 16px; cursor: pointer; font-weight: 700; margin-top: 10px;
            box-shadow: 0 4px 12px rgba(27, 67, 50, 0.25); transition: all 0.3s ease;
        }

        .btn-submit:hover:not(:disabled) {
            background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
            transform: translateY(-2px);
        }

        .btn-submit:disabled { background: #a5a5a5; cursor: not-allowed; }

        .btn-back {
            width: 100%; background-color: #64748b; color: white; border: none;
            padding: 12px; border-radius: 8px; font-size: 14px; cursor: pointer;
            font-weight: 600; margin-top: 10px; display: flex; align-items: center;
            justify-content: center; gap: 6px; text-decoration: none;
        }

        .footer-text { text-align: center; margin-top: 25px; font-size: 12px; color: #8d99ae; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="header-brand">
            <h1 id="districtTitle">جاري جلب اسم المقاطعة...</h1>
            <h2>النظام الرقمي الخاص بمتابعة الوضعية الإدارية للأساتذة</h2>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">اسم المستخدم:</label>
                <input type="text" id="username" placeholder="أدخل اسم المستخدم" required autocomplete="username">
            </div>
            
            <div class="form-group">
                <label for="password">كلمة المرور:</label>
                <input type="password" id="password" placeholder="أدخل كلمة المرور" required autocomplete="current-password">
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">تسجيل الدخول</button>
            
            <button type="button" class="btn-back" onclick="goBackHome()">
                <span>←</span> العودة لاختيار المقاطعة
            </button>
        </form>

        <div class="footer-text" id="footerText">
            جميع الحقوق محفوظة © النظام الرقمي
        </div>
    </div>

<script>
    const MAIN_PORTAL_URL = "https://script.google.com/macros/s/AKfycbxpMWiDgT8pgT_jkdDmP9mwfLZD1Wkaz63jWZAxy8iyk5maJNZCzZnQp3eS4jPEBIjshQ/exec";

    const districtName = localStorage.getItem("currentDistrictName");
    let targetScriptUrl = "";

    if (!districtName) {
        alert("يرجى اختيار المقاطعة أولاً.");
        window.location.href = "index.html";
    }

    document.getElementById('districtTitle').textContent = districtName;
    document.getElementById('footerText').textContent = "جميع الحقوق محفوظة © " + districtName;

    function goBackHome() {
        window.location.href = "index.html";
    }

    // جلب رابط المقاطعة من الشيت المركزي لتجهيزه لعملية تسجيل الدخول
    async function loadDistrictUrl() {
        try {
            const response = await fetch(`${MAIN_PORTAL_URL}?action=getScriptUrl&district=${encodeURIComponent(districtName)}`);
            const result = await response.json();

            if (result.status === "success" && result.scriptUrl) {
                targetScriptUrl = result.scriptUrl;
                localStorage.setItem("currentScriptUrl", targetScriptUrl);
            } else {
                alert("لم يتم العثور على رابط هذه المقاطعة في الشيت المركزي.");
            }
        } catch (error) {
            console.error("خطأ في جلب رابط المقاطعة:", error);
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        loadDistrictUrl();
    });

    async function handleLogin(e) {
        e.preventDefault();
        
        if (!targetScriptUrl) {
            targetScriptUrl = localStorage.getItem("currentScriptUrl");
        }

        if (!targetScriptUrl) {
            return alert("تعذر جلب رابط المقاطعة، يرجى المحاولة مرة أخرى.");
        }

        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.textContent = "جاري التحقق من بيانات الدخول...";

        const data = {
            action: "login",
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value.trim()
        };

        try {
            const response = await fetch(targetScriptUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8'
                },
                body: JSON.stringify(data)
            });
            
            const result = await response.json();
            
            if (result.status === "success") {
                const cleanRole = (result.user.role || "").toString().trim().toLowerCase();
                result.user.role = cleanRole;
                localStorage.setItem("userSession", JSON.stringify(result.user));
                
                if (cleanRole === "admin") {
                    window.location.href = "dashboard-admin.html";
                } else if (cleanRole === "director") {
                    window.location.href = "dashboard-director.html";
                } else if (cleanRole === "inspector") {
                    window.location.href = "dashboard-inspector.html";
                } else {
                    alert("تم الدخول، لكن الصلاحية غير معروفة: " + cleanRole);
                    submitBtn.disabled = false;
                    submitBtn.textContent = "تسجيل الدخول";
                }
            } else {
                alert(result.message || "اسم المستخدم أو كلمة المرور غير صحيحة.");
                submitBtn.disabled = false;
                submitBtn.textContent = "تسجيل الدخول";
            }
        } catch (error) {
            alert("حدث خطأ أثناء إرسال بيانات الدخول إلى الخادم.");
            submitBtn.disabled = false;
            submitBtn.textContent = "تسجيل الدخول";
        }
    }
</script>
</body>
</html>
