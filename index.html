<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - النظام الرقمي لمتابعة الوضعية الإدارية للأساتذة</title>
    <!-- استدعاء خط Cairo الاحترافي -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #1b4332;
            --primary-hover: #2d6a4f;
            --accent-color: #d4af37;
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-color: #2b2d42;
            --input-border: #d8e2dc;
        }

        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* دوائر زخرفية خلف البطاقة */
        body::before {
            content: '';
            position: absolute;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            top: -50px;
            right: -50px;
            z-index: 1;
        }

        body::after {
            content: '';
            position: absolute;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.03);
            bottom: -100px;
            left: -100px;
            z-index: 1;
        }

        .login-card {
            background-color: var(--card-bg);
            padding: 40px 35px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
            width: 90%;
            max-width: 440px;
            position: relative;
            z-index: 2;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
        }

        .header-brand {
            text-align: center;
            margin-bottom: 25px;
        }

        .header-brand h1 {
            font-size: 14px;
            font-weight: 700;
            color: #d4af37;
            background-color: #f8f9fa;
            padding: 6px 12px;
            border-radius: 20px;
            display: inline-block;
            margin: 0 0 12px 0;
            border: 1px solid #e9ecef;
        }

        .header-brand h2 {
            font-size: 19px;
            font-weight: 700;
            color: var(--primary-color);
            margin: 0;
            line-height: 1.4;
            position: relative;
            padding-bottom: 12px;
        }

        .header-brand h2::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 50%;
            transform: translateX(50%);
            width: 60px;
            height: 3px;
            background-color: var(--accent-color);
            border-radius: 2px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-color);
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1.5px solid var(--input-border);
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.3s ease;
            background-color: #f8fafc;
            color: var(--text-color);
        }

        .form-group input:focus {
            outline: none;
            border-color: #2c5364;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(44, 83, 100, 0.15);
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #1b4332 0%, #2d6a4f 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 700;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(27, 67, 50, 0.25);
            transition: all 0.3s ease;
        }

        .btn-submit:hover:not(:disabled) {
            background: linear-gradient(135deg, #2d6a4f 0%, #1b4332 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(27, 67, 50, 0.35);
        }

        .btn-submit:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            background: #a5a5a5;
            cursor: not-allowed;
            box-shadow: none;
        }

        .footer-text {
            text-align: center;
            margin-top: 25px;
            font-size: 12px;
            color: #8d99ae;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="header-brand">
            <h1>المقاطعة البيداغوجية -يوب 2-</h1>
            <h2>النظام الرقمي الخاص بمتابعة الوضعية الإدارية للأساتذة</h2>
        </div>
        
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">اسم المستخدم:</label>
                <input type="text" id="username" placeholder="أدخل اسم المستخدم" required autocomplete="username">
            </div>
            
            <div class="form-group">
                <label for="password">كلمة المرور:</label>
                <input type="password" id="password" placeholder="أدخل كلمة المرور" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn-submit">تسجيل الدخول</button>
        </form>

        <div class="footer-text">
            جميع الحقوق محفوظة © المقاطعة البيداغوجية -يوب 2-
        </div>
    </div>

<script>
    // رابط الـ Web App المعتمد
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxEmbj3B77F_3bL4kHqGX0IhqaCCMEyDpAnavutAZlZ2FescguTM3xmh-8Ikb9-0cBV/exec";

    async function handleLogin(e) {
        e.preventDefault(); // إيقاف إعادة تحميل الصفحة الافتراضي
        
        const submitBtn = document.querySelector('button[type="submit"]');
        submitBtn.disabled = true;
        submitBtn.textContent = "جاري التحقق...";

        const data = {
            action: "login",
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value.trim()
        };

        try {
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(data)
            });
            
            const result = await response.json();
            
            if (result.status === "success") {
                // تنظيف الصلاحية من الفراغات وتحويلها لحروف صغيرة لضمان التوجيه
                const cleanRole = (result.user.role || "").toString().trim().toLowerCase();
                result.user.role = cleanRole;
                
                // حفظ البيانات في الجلسة المحلية
                localStorage.setItem("userSession", JSON.stringify(result.user));
                
                // التوجيه للوحة التحكم المناسبة
                if (cleanRole === "admin") {
                    window.location.href = "dashboard-admin.html";
                } else if (cleanRole === "director") {
                    window.location.href = "dashboard-director.html";
                } else if (cleanRole === "inspector") {
                    window.location.href = "dashboard-inspector.html";
                } else {
                    alert("تم الدخول، لكن الصلاحية غير معروفة: " + cleanRole);
                    submitBtn.disabled = false;
                    submitBtn.textContent = "تسجيل الدخول";
                }
            } else {
                alert(result.message);
                submitBtn.disabled = false;
                submitBtn.textContent = "تسجيل الدخول";
            }
        } catch (error) {
            alert("حدث خطأ في الاتصال بالخادم.");
            submitBtn.disabled = false;
            submitBtn.textContent = "تسجيل الدخول";
        }
    }
</script>
</body>
</html>
